name = "bgp212"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["BGP212"]

[leanOptions]
relaxedAutoImplicit = false

# Core Lean only: the first challenge needs no Mathlib, which keeps the trusted
# base to the Lean kernel plus core. Mathlib enters with Track B (multi-shift GDT).

[[lean_lib]]
name = "BGP212"

# The comparator pair. Deliberately NOT in defaultTargets: `Challenge` carries a
# permanent `sorry` (its statements are the artifact). The comparator builds both.

[[lean_lib]]
name = "Challenge"

[[lean_lib]]
name = "Solution"

# Track B (multi-shift GDT) builds on Mathlib. GDT v1.0.0's definitions and lemmas are
# vendored in BGP212/GDTv1Basic.lean and BGP212/GDTv1.lean (provenance in their headers):
# a package dependency would collide with GDT's own `Challenge`/`Solution` libraries.
# The Track A pairs import neither, so their trusted base stays the Lean kernel plus core.

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4"
rev = "85e3a25e006c35636f0e53b0e9296caca2685bc0"   # the Mathlib commit pinned by GDT v1.0.0

