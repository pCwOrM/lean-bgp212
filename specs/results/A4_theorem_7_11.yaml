  findings:
    F1_type_III_width: >
      Definition 7.1 (III) allows N_i ≤ x^{ξ₃+ϵ}, so Lemma 5.7 is applied at γ = ξ₃ + ϵ. At that
      γ the printed δ* = 1/2 − 7ω/2 − 9ξ₃/8 − ϵ gives 28ω + 9γ + 8δ* = 4 + ϵ, outside the
      permissible set (type_III_printed_gap). The width δ* = 1/2 − 7ω/2 − 9ξ₃/8 − 11ϵ/8 is
      permissible with margin ϵ, satisfies δ* > δ under the printed (III), and the printed (E)
      still yields the containment (perm_type_III, containment_III). Any δ* in
      [1/2 − 7ω/2 − 9ξ₃/8 − 3ϵ/2, 1/2 − 7ω/2 − 9ξ₃/8 − 9ϵ/8) works.
    F2_type_I_high_width: >
      For γ ∈ (1/2, 1/2 + 2ω + ε], the proof allows "any δ*(γ) ∈ [δ, 1/14 − 68ω/14 − ϵ]". The
      equidistribution step accepts any such δ*; the containment from (7.6) needs δ* near the
      top of that interval (type_I_high_choice). A4 uses the top, δ* = 1/14 − 68ω/14 − ϵ.
    F3_type_IIc_reduction: >
      The proof replaces δ*(γ) by δ in the four-bin criterion "since a smaller δ makes these
      conditions easier to satisfy". The first capacity improves and the third worsens as δ*
      decreases (type_IIc_mixed_monotonicity). The criterion is exact for the choice
      δ*(γ) = δ, which the printed admissible interval contains over the whole IIc range under
      condition (II) (perm_type_IIc); A4 uses that choice.
    F4_lemma_4_2_step: >
      Definition 4.1 requires B_{j,m+1} ≤ B_{j,m} + δ where both sides are defined (m ≥ 1);
      with B_{j,0} = 0 the step from 0 fails at Table 3 (lemma_4_2_step_at_zero). Lemma 4.2's
      iteration B_{j,m} ≤ B_{j,r} + (m − r)δ therefore runs from r ≥ 1, and I′ = ∅ is immediate.
      A2's lemma_4_2 assumes the step for every q including 0; a variant with q ≥ 1 is the
      one Table 3 instantiates.
    F5_closed_windows: >
      Lemmas 7.5–7.7 produce r ∈ [x^a, x^b] while D_I … D_III use open windows; the proof of
      Proposition 7.8 applies the lemmas with a, b set to the open endpoints. The containments
      here are stated with the closed windows the lemmas produce.
    F6_empty_profiles: >
      Lemma 7.10 is stated for 1 ≤ m ≤ m′ ≤ 13; Proposition 7.8 needs all m, m′ ≤ ⌊1/δ⌋ = 60
      with m + m′ > 0, in both orders. lemma_7_10_case_split supplies them from the 455 roots
      exactly as Lemma 7.10's proof sketches (adjoin and delete a part of size δ; vacuity for
      m ≥ 14 since 14δ > 1081/5000), and also covers m = m′ = 0 (every capacity is
      nonnegative at Table 3).
  exploratory_vs_proved: >
    Proved: every theorem listed under signatures. Named hypotheses: the AnalyticInputs
    fields. No external certificates enter A4; it reuses the kernel-checked lemma_7_10.
