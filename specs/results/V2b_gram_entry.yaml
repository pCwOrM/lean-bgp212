# Result record: thirteenth Challenge/Solution pair (V2b, the first Gram entry as a Lebesgue integral)

identity:
  id: V2b
  statement: "I_T[(1, ∅), (0, (2))] = ∫_{T̃} (L − P₁) P₂ dx over Lemma 9.1's rescaled support with Table 3's caps, proved as a Lebesgue integral and evaluated exactly; the integral identity behind it holds for every dimension, g ≥ 0, L and cap function"
  source: "Source/bgp212.pdf: Table 3 (p. 39), §9.3 and Lemma 9.1 (pp. 40–41), (10.1), Lemma 10.1, Proposition 10.2 (pp. 41–42), §11 (p. 42)"
  builds_on: "V1 (simplex_integral), V0 (gen, Plam, P), A1 (BGP212.Params: Bnum, B, C, g, L); exploratory V2a (bd312a9) for the decomposition and the value; A0–V1 unchanged"

state:
  mathematical: proved
  computational: kernel-verified
  provenance: pinned
  publication: draft

scope:
  proved_integral_identities: >
    integral_supportT: ∫_{supportT N g L C} (L − Σx)^p x_a^e = gramFormula N g L C e p for all
    N, g ≥ 0, L, C : ℕ → ℝ, a : Fin N, e, p. gram_entry_integral_general: the entry
    ∫ (L − P₁)P₂ = N · gramFormula N g L C 2 1. Every intermediate step is a theorem:
    simplexF_integral, weighted_simplexF, indicator_supportT, integral_Qset,
    piece_integral_mem/notMem/empty/univ, count_pieces, supportT_zero_dim,
    integral_supportT_zero_dim, supportT_mono, gramFormula_ratCast.
  computational_certificate: >
    gramEntryQ_eq: gramFormula 45 g L C 2 1 at Table 3 is evaluated over ℚ by the kernel
    (decide +kernel), one lemma per row r = 0…44 (Solution/GramEntryCert.lean, generated by
    specs/checks/gram_entry_v2b_emit.py), summed by norm_num. The certificate is a Lean proof;
    "computational" records that its content is exact arithmetic.
  unproved_assumptions: "none for this entry (axioms: propext, Quot.sound, Classical.choice)"
  outside_V2b: >
    other Gram entries (general monomials P_Λ with several distinguished coordinates); J_T and
    the marginal fibres of Lemma 9.2; the §9.3 rescaling to the physical support; P⋆ and
    Theorem 11.1. The cap question of V2a (which caps Axiom's certificate used) is untouched:
    every statement is parametrized by C, and supportT_mono records the inclusion.

verification:
  definitions: BGP212/GramEntry.lean
  challenge: Challenge/GramEntry.lean
  solution: [Solution/GramEntry.lean, Solution/GramEntryCert.lean]
  comparator_config: Comparator/gram_entry_v2b.json
  certificate_generator: specs/checks/gram_entry_v2b_emit.py
  controls_script: specs/checks/gram_entry_v2b_controls.py
  transcription:
    supportT: "{x : Fin N → ℝ | (∀ i, 0 ≤ xᵢ) ∧ Σ xᵢ ≤ L ∧ Σ_{i ∈ roughSet g x} xᵢ ≤ C |roughSet g x|}, roughSet g x = {i | g < xᵢ} (Lemma 9.1)"
    table3_instance: "N = 45, g = 41/625, L = 53/50, C = BGP212.Params.C (C(m) = 4B₁,ₘ, C(0) = 0)"
    entry: "(53/50 − Σ xᵢ) · Σ xᵢ² = gen 1 ∅ · gen 0 {2} evaluated at x (gram_entry_B21)"
  proof_outline: >
    (1) indicator_supportT: 1_{T̃} = Σ_R Σ_{K⊆Rᶜ} (−1)^{|K|} 1_{Qset R K} pointwise, where the rough
    set picks out R and Σ_{K⊆S}(−1)^{|K|} = [S = ∅] removes the smooth upper bounds; no null set
    is discarded here. (2) integral_Qset: translate by g·1_{R∪K} (integral_add_right_eq_self); the
    strict faces yᵢ > 0 differ from the closed piece by hyperplanes yᵢ = 0 (Measure.pi_hyperplane).
    (3) piece integrals: split y = (y|_R, y|_{Rᶜ}) (volume_preserving_piEquivPiSubtypeProd), Fubini
    (integral_fibred), the inner block by weighted_simplexF (V1's (10.1) on ι ⊕ Unit plus Fubini),
    the outer block by expanding (M − Σz)^q around min(c, M) and weighted_simplexF again.
    (4) count_pieces: Σ_{R,K} grouped by |R|, |K| and the position of a (sum_powerset_insert,
    sum_powerset_apply_card). (5) linearity over a and the cast ℚ → ℝ.
  boundary_cases:
    - "simplexF_integral_isEmpty: ℝ⁰ is a point of measure one"
    - "piece_integral_empty (R = ∅): the full simplex of radius M"
    - "piece_integral_univ (R = univ): the complement block is ℝ⁰"
    - "supportT_zero_dim, integral_supportT_zero_dim (N = 0)"
    - "pieceSet_empty: negative cap or radius gives the empty piece"
  value:
    gramEntryQ: "56548202531757829081…729132412243771531 / 475777117431212313155…000 (149 / 207 digits)"
    decimal: "1.18854397279696 × 10⁻⁵⁸"
    agreement: "equals V2a's exploratory entry_45 exactly (checked by the emitter)"
  axioms_used: [propext, Quot.sound, Classical.choice]
  trusted_base: "Lean 4 kernel + core + Mathlib (Track B, pinned 85e3a25)"
  controls:
    - change: "N = 1: ∫_{T̃₁} (L − x) x² = L·C(1)³/3 − C(1)⁴/4 (independent closed form); N = 2: V2a's polygon-clipping value; N = 45: gramEntryQ's value"
      result: "accepted (positive controls)"
    - change: "N = 1 uncapped value L⁴/12; N = 2 with the two-level caps of Lemma 9.1's proof; N = 45 uncapped simplex value (relative difference 7.4·10⁻¹³)"
      result: "rejected (decide refutes the N = 1 and N = 2 claims; norm_num reduces the N = 45 claim to False)"
    - change: "gram_entry_integral_general claimed with (N − 1) in the Challenge"
      result: "rejected: 'Challenge and solution theorem statement do not match: BGP212.Challenge.gram_entry_integral_general'"
  resources:
    new_mathlib_modules: "2 beyond V1 (Mathlib.MeasureTheory.Group.Integral, Mathlib.Algebra.MvPolynomial.CommRing); both in the Mathlib cache"
    certificate_build: "Solution.GramEntryCert: 86 s, peak 4.2 GB (45 row lemmas); the undivided evaluation exceeds 8 GB"
    comparator_suite: "about 3 minutes 15 seconds in the build container"
    scaling: >
      This route costs one row lemma per rough count r and about 86 s per entry of this degree.
      Beyond this entry: (a) general Gram entries need monomials with several distinguished
      coordinates (the counting extends to 3^d placements); (b) the 22,609 distinct I-entries at
      this cost would take about 22 CPU-days, and higher degrees cost more; (c) recommended:
      certify I_T(P⋆) and J_T(P⋆) − 4I_T(P⋆) directly (two numbers), with integer arithmetic over
      a common denominator, rather than all matrix entries.
  sandbox: >
    Comparator ran on the VPS using the real landrun sandbox via ./verify.sh.
    All thirteen Comparator suites passed Lean kernel verification.
    Three positive controls passed and three negative controls were rejected.
    The N1 and N2 negative controls failed at the decide tactic.

