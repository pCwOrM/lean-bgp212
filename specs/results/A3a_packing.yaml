# Result record: sixth Challenge/Solution pair (A3a, Lemma 7.10 packing, first part)

identity:
  id: A3a
  statement: "Lemma 7.10: 296 of its 455 packing roots, plus the greedy packing lemma and the root ledger"
  source: "Source/bgp212.pdf: Definition 7.4 (p. 28), Proposition 7.8 (A)–(E) (pp. 31–32), Lemma 7.10 (p. 36)"
  specification: specs/A0_parameters.yaml   # Table 3 via BGP212.Params

state:
  mathematical: proved          # for the 296 settled roots; 159 roots remain open
  computational: kernel-verified
  provenance: pinned
  publication: draft

verification:
  challenge: Challenge/Packing.lean
  solution: Solution/Packing.lean
  definitions: BGP212/Packing.lean
  comparator_config: Comparator/packing_a3a.json
  theorems:
    greedy_pack: "items ≤ s, capacities ≥ 0, distinct bins sel: total ≤ Σ_sel cap − (|sel| − 1)s ⟹ the items pack"
    largest_coordinate: "on a side of k coordinates, each ≥ δ, sum ≤ B: each coordinate ≤ B − (k − 1)δ"
    omega_matches_table3: "ω(1,1) = (A₁ + A₁)/2 − 1/4 equals Table 3's ω = 7/1000"
    root_ledger: "settledRoots (296) and openRoots (159) together are a permutation of allRoots (455)"
    lemma_7_10_settled: "every settled root holds for every profile in Ξ(B₁,ₘ, B₁,ₘ′, m, m′, δ)"
  faithfulness:
    profile_domain: "InXi is Definition 7.4: m and m′ coordinates, each in [δ, 1], side sums ≤ B₁,ₘ and B₁,ₘ′"
    partitions: "Packs encodes a partition I₁ ∪ … ∪ I_k as an assignment of coordinates to bins; empty parts allowed"
    capacities: "transcribed from Proposition 7.8 (A)–(E) with ω(1,1) and ϵ = εₐ = 10⁻¹⁰; condition (A) requires both of its partitions"
    uniformity: >
      Each Root quantifies over every profile in its domain. The settled (D) root (1, 1)
      quantifies over the full box 0 ≤ ω₀ ≤ ω(1,1), 2/5 − εₐ ≤ γ ≤ 1/3 + 8ω(1,1) + 7δ/3 + 3εₐ,
      and is proved for arbitrary (γ, ω₀) in that box by linear arithmetic; no sampling or
      corner evaluation enters the kernel proof.
  certificate_strategy: >
    For (A), (B), (C), (E) each settled root carries a certificate, the bin selection(s) in
    certTable. certValid re-checks in exact rationals inside the kernel (decide +kernel):
    selection nonempty and duplicate-free, indices in range, every capacity ≥ 0, and
    B₁,ₘ + B₁,ₘ′ ≤ Σ_sel cap − (|sel| − 1)·s(m, m′) with
    s(m, m′) = max(B₁,ₘ − (m − 1)δ, B₁,ₘ′ − (m′ − 1)δ). pack_of_cert turns a valid certificate
    into the root through greedy_pack and largest_coordinate.
  certificate_data:
    file: specs/certificates/packing_a3a.json
    generator: specs/checks/packing_ledger.py
    consistency_check: specs/checks/packing_certificates_match.py   # Lean tables = JSON
    counts: { settled: 296, open: 159, certificates: 295, hand_proved: "(D, 1, 1)" }
    settled_by_condition: { A: 60, B: 91, C: 78, D: 1, E: 66 }
    open_by_condition: { A: 31, C: 13, D: 90, E: 25 }
  exploratory_vs_proved: >
    The Python generator is exploratory: it searches bin subsets and writes the ledger. The
    kernel-checked content is lemma_7_10_settled and root_ledger; every inequality a
    certificate relies on is re-checked by the Lean kernel.
  axioms_used: [propext, Quot.sound, Classical.choice]
  trusted_base: Lean 4 kernel + core library (Mathlib absent from this pair)
  scope_boundary:
    - "159 roots stay open: A3b targets them with subdivision and Farkas certificates."
    - "Profiles with an empty side (m = 0 or m′ = 0) follow in the source by adjoining a part of size δ; that reduction is outside A3a."
  negative_controls:
    - change: "greedy loss (|sel| − 1)·s weakened to (|sel| − 2)·s in the Challenge"
      result: "rejected: 'Challenge and solution theorem statement do not match: BGP212.Challenge.greedy_pack'"
    - change: "lemma_7_10_settled claimed for allRoots (all 455) in the Challenge"
      result: "rejected: 'Challenge and solution theorem statement do not match: BGP212.Challenge.lemma_7_10_settled'"
    - change: "open root (D, 1, 2) moved into settledRoots"
      result: "Solution fails to build: kernel errors at root_ledger and settled_covered"
    - change: "capacity of (A) first bin lowered from ξ₁ − 2ϵ to ξ₁ − 1/10"
      result: "Solution fails to build: 'Tactic decide failed' at certTable_valid"
  sandbox: >
    Comparator ran with the pass-through landrun stand-in in the authoring environment.
    Rerun ./verify.sh on the VPS with the real landrun to record a sandboxed result.

result:
  toolchain: leanprover/lean4:v4.34.0-rc2
  comparator: leanprover/comparator @ c78dd72
  lean4export: leanprover/lean4export @ 483e011
  output_tail:
    - "Running Lean default kernel on solution."
    - "Lean default kernel accepts the solution"
    - "Your solution is okay!"
  solution_build_time: "about 20 s"
  run_date: 2026-10-16
  commit_hash: null   # set to the verified commit after the VPS run

