  challenge: Challenge/GramGeneral.lean
  solution: [Solution/GramGeneral.lean, Solution/GramGeneralCert.lean]
  comparator_config: Comparator/gram_general_v2c.json
  certificate_generator: specs/checks/gram_general_v2c_emit.py
  controls_script: specs/checks/gram_general_v2c_controls.py
  closed_form: >
    gramGen N g L C e p = Σ_{A ⊆ D} Σ_{B ⊆ D \ A} (−1)^{|B|} Σ_r C(N−|D|, r) Σ_k C(N−|D|−r, k) (−1)^k
    phiGen(A, B, |A| + r, |B| + k), D = supp e; phiGen sums over exponent vectors t ≤ e the
    coefficients ∏ C(eᵢ, tᵢ) (g·[i ∈ A ∪ B])^{eᵢ−tᵢ} times the two-group value twoGroupW with
    exponent totals Σ_A t, Σ_{Aᶜ} t and weight ∏ tᵢ!.
  generator_specification: >
    ∫_{T̃} gen a qs · gen a' qs' = Σ_{φ : Fin |qs ++ qs'| → Fin 45} gramGen 45 g (53/50) C
    (expo (qs ++ qs') φ) (a + a'), with expo qs φ i = Σ_{j : φ j = i} qs[j]: every product of power
    sums is a sum of monomials indexed by placements of its parts (prod_power_sums).
  worked_example:
    entry: "I_T[(1, (2)), (0, (2))] = ∫_{T̃} gen 1 {2} · gen 0 {2} = ∫_{T̃} (L − P₁) P₂²"
    decomposition: "45 · ∫ (L − Σx) x₀⁴ + 45·44 · ∫ (L − Σx) x₀² x₁² (placements φ with φ₀ = φ₁, φ₀ ≠ φ₁; symmetry by gramGen_perm; transport by gramGen_extend)"
    value: "gramExampleQ ≈ 5.45080819523255 × 10⁻⁶⁰ (exact rational in gram_entry_example_value)"
    independent_checks: "both closed forms equal V2a's exploratory moment computation exactly (∫ (L − Σx)x₀⁴ = L m(4) − m(5) − 44 m(4,1); ∫ (L − Σx)x₀²x₁² = L m(2,2) − 2 m(3,2) − 43 m(2,2,1))"
  boundary_cases:
    - "integral_supportT_gen_zero, gramGen_zero_eq_gramFin: no distinguished coordinates (d = 0)"
    - "gramGen_single: one distinguished coordinate recovers V2b's gramFormula"
    - "V2b's boundary theorems (R = ∅, R = univ, N = 0, empty index types, empty pieces) are reused unchanged"
  axioms_used: [propext, Quot.sound, Classical.choice]
  trusted_base: "Lean 4 kernel + core + Mathlib (Track B, pinned 85e3a25)"
  controls:
    - change: "N = 2, two distinguished coordinates: gramFin 2 2 … ![2, 2] 1 equals ∫_{T̃₂} (L − x − y) x² y² by exact polygon clipping (independent method); general formula with one coordinate equals V2b's at N = 3; the worked example's value"
      result: "accepted (positive controls)"
    - change: "N = 2 with the two-level caps of Lemma 9.1's proof; the example with the diagonal counted twice (45·F4 + 2025·F22); the example over the uncapped simplex (relative difference 2.8·10⁻¹²)"
      result: "rejected"
    - change: "integral_supportT_gen claimed with weight p + 1 in the Challenge"
      result: "rejected: 'Challenge and solution theorem statement do not match: BGP212.Challenge.integral_supportT_gen'"
  resources:
    new_mathlib_modules: "none beyond V2b"
    proof_modules: "Solution.GramGeneral elaborates in under a minute; no kernel arithmetic"
    certificate_build: "Solution.GramGeneralCert: about 19 minutes (1135 s), peak 4.7 GB; 531 cell lemmas, 89 row lemmas"
    per_cell_cost: "about 10 s and about 1.5 GB above the import baseline per nonzero cell (row r, placement (A, B)); memory is released between declarations"
    comparator_suite: "about 21 minutes 40 seconds in the build container (it replays the certificate)"
    disk: "about 7.4 MB of new build artefacts (GramGeneralCert.olean 2.2 MB); no new Mathlib modules"
    design_finding: >
      Evaluated directly, the N-indexed closed form gramGen is out of reach for the kernel (one
      row exceeded 8 GB): every placement term walks products and piFinset over all 45
      coordinates. The transport theorem gramGen_extend moves the evaluation to gramFin, with
      loops over the d distinguished coordinates only; this is a proved reduction, so the
      certificate's cost scales with d and the number of placements (3^d), not with N.
    scaling_estimate: >
      A Gram entry gen i · gen j expands into placements of |λ| + |λ'| ≤ 40 parts; symmetry
      reduces placements to set partitions of the parts (Bell numbers), and each distinct
      monomial profile costs about 3^d cells × (rows ≤ 14) at about 10 s per nonzero cell.
      For d = 2 that is about 15 minutes; d = 4 about 2 hours; the largest profiles (d up to
      20) are far beyond direct cell certification. Expanding computational certificates needs
      (a) the placement sum over A, B collapsed by symmetry within equal exponents, (b) integer
      arithmetic over a common denominator, and (c) certifying I_T(P⋆), J_T(P⋆) − 4 I_T(P⋆)
      directly rather than all entries.
  sandbox: >
    Comparator ran on the VPS using the real landrun sandbox via ./verify.sh.
    All fourteen Comparator suites passed Lean kernel verification.
    Three positive controls passed and three negative controls were rejected.

