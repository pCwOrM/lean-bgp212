  definitions_note: >
    DHL quantifies over Finset ℤ of card k (distinct integers), admissibility omits a residue
    class modulo every prime, and "infinitely many integers n" is Set.Infinite on ℤ. H1Le D is
    "∃ᶠ n, p_{n+1} − p_n ≤ D" with p_n = Nat.nth Nat.Prime n; h1_liminf gives liminf ≤ D.
    supportSet transcribes Definition 4.1's T_k over ℝ with the rational datum.
  findings:
    F1_wtrick_bound: >
      Lemma 4.9 requires |h_i − h_i′| < log log log x. The proof uses only that every prime
      dividing a difference of distinct shifts is at most w (wtrick_coprime_of_primes). For
      H₄₅ every element is even, so every such prime is at most 103 (h45_diff_primes), and
      w ≥ 103 suffices (h45_wtrick_coprime) in place of w > 212; 103 is sharp, since
      103 ∣ 206 − 0 (h45_wtrick_sharp).
    F2_hypotheses_needed: >
      Both hypotheses of the coprimality step carry weight: wtrick_needs_prime_bound and
      wtrick_needs_coprime_residue exhibit systems meeting every other hypothesis whose moduli
      share a prime.
    F3_theorem_11_1_normalization: >
      Theorem 4.10 asks k·J_T(F) > I_T(F) with J_T one marginal (Definition 4.6), and §9.3 gives
      k·J(F)/I(F) = (1/4)·k·J(F̃)/I(F̃). Theorem 11.1 prints J_T(F⋆)/I_T(F⋆) = 4.0043… > 4 and
      §1 prints J_T(F⋆) − 4I_T(F⋆) > 0; these match the physical inequality when J_T in
      Theorem 11.1 denotes the sum of the k marginals, k·J. With a single marginal the
      printed ratio would correspond to k·J(F̃)/I(F̃) ≈ 45 × 4.004. The interface states
      Theorem 4.10's form, k·J_T(F) > I_T(F), and theorem_11_1 is read in that form.
    F4_paper_vs_lean: >
      The paper's Theorem 1.1 is unconditional mathematics; in Lean, H₁ ≤ 212 holds relative to
      the named fields of AnalyticInputs and SieveInputs, while DHL[45, 2] ⇒ H₁ ≤ 212 and every
      combinatorial ingredient are proved outright.
