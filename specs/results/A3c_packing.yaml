    sizes: { roots: 43, leaves: 1601, cuts: 1558, empty_cells: 0, kernel_pieces: 454, max_leaves_per_root: 183, max_depth: 31 }
  exploratory_vs_proved: >
    Exploratory: the generator (scipy.optimize.linprog and milp proposals; exact Fraction
