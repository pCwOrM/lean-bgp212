  checker: Solution/PackingCertC.lean          # extends Solution/PackingCert.lean
  certificate_data: [Solution/PackingCData.lean, Solution/PackingCCheck.lean]
  comparator_config: Comparator/packing_a3c.json
  theorems:
    lemma_7_10_a3c: "openRootsB has 43 roots, and each holds for every profile in its domain, uniformly over the full (γ, ω₀) box"
    lemma_7_10_all: "allRoots has 455 roots, and each holds"
    lemma_7_10: "for every condition (A)–(E) and all 1 ≤ m ≤ m′ ≤ 13, Root c m m′"
  framework_theorems:              # proved in Solution/PackingCertC.lean, used by the proofs above
    emptyB_sound: "a cell with a checked Farkas infeasibility certificate (λ ≥ 0, Σλa = 0, Σλb < 0) contains no point"
    checkTree2_sound: "for any capacity data, a checked tree (leaf | split | empty) yields a valid assignment at every point of its cell"
    checkTree2_toTree2: "every A3b tree is an A3c tree with the same verdict"
    checkTree2_split_path: "assembly: a split node checks on the cell base ++ path when its two children check on base ++ path ++ [each side]"
    rowC_sound: "a checked (D) row proves its root"
    empty_cell_example: "a kernel-checked empty cell: the cut y₁ ≥ 1/2 on the (D, 1, 3) base cell"
  checker_design: >
    A3c's tree has three node kinds. leaf and split are A3b's; empty carries exact Farkas
    infeasibility multipliers. Every cut is an integer vector over all coordinates (both
    sorted sides and γ, ω₀). A large tree is stored node by node: each subtree with at most 8
    leaves is one definition checked by one kernel `decide` on its own cell (the base cell
    plus the cuts on its path, `pathCell`), and the nodes above are assembled by
    checkTree2_split_path. This bounds kernel memory per decision.
  method: >
    Lazy point generation with load-hyperplane cuts. At a cell a MILP finds an assignment
    that fits every sample point so far; an LP maximises each bin's load minus capacity over
    the whole cell; a bin that cannot overflow gets exact Farkas multipliers (LP dual support
    re-solved in exact rational arithmetic); an overflowing bin adds the LP maximiser to the
    samples. When the samples admit no common assignment, the cell is cut along the load
    hyperplane load_k(a)(v) = cap_k(γ, ω₀) of an assignment a that failed on bin k: on one
    side bin k fits, on the other a is ruled out. Each cut vector is 0/1 on the coordinates and
    small integers on (γ, ω₀).
  simplification: >
    Load-hyperplane cuts replace coordinate bisection. On the pilot roots, coordinate bisection
    in profile space needed 89 leaves for (D, 2, 2), 173 for (D, 3, 3), and did not terminate
    for (D, 4, 4) within depth 40 (a diagonal boundary approached by axis cuts); load-hyperplane
    cuts need 3, 9 and 7 leaves. Over all 43 roots: 1601 leaves, 1558 cuts, maximum depth 31.
  certificates:
    file: specs/certificates/packing_a3c.json
    sha256: d6c5ba25567b4711b863bf5b83b1d4cc777659405df12de93ed33384e8bcfba1
